# This is a basic workflow that is manually triggered

name: auto_Reserve

on:
  schedule:
    - cron: "00 22 * * *"   # UTC 04:57 = 北京时间 12:57   # UTC 22:00 = 北京时间次日 06:00
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2  # ✅ 修复：pinned 到原生支持 Node 24 的版本

      - name: Set up Python 3.11
        uses: actions/setup-python@v5.6.0  # ✅ 修复：同上，移除 FORCE_JAVASCRIPT_ACTIONS_TO_NODE24
        with:
          python-version: 3.11

      - name: install dependency
        run: |
          python -m pip install --upgrade pip
          pip install cryptography requests

      - name: run script
        env:
          USERNAMES: ${{ secrets.USERNAMES }}
          PASSWORDS: ${{ secrets.PASSWORDS }}
        run: |
          python main.py -m reserve --action
